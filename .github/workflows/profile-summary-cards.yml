name: Profile summary cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

# The README only uses the "github" (light) and "github_dark" themes. The action
# wipes its output folder on every run and can only target one theme at a time,
# so it runs once per theme and the light cards are set aside in between.
env:
  # Personal access token (counts private activity), else the built-in token.
  GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  OUTPUT_DIR: profile-summary-card-output

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          TIME_ZONE: Asia/Karachi
          NAME: Muhammad Abubakar
          AUTO_PUSH: false

      - name: Set light cards aside
        run: mv "$OUTPUT_DIR/github" "$RUNNER_TEMP/github"

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          TIME_ZONE: Asia/Karachi
          NAME: Muhammad Abubakar
          AUTO_PUSH: false

      - name: Commit and push cards
        run: |
          mv "$RUNNER_TEMP/github" "$OUTPUT_DIR/github"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$OUTPUT_DIR"
          git diff --cached --quiet || git commit -m "chore: update profile summary cards"
          git push
